name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://testproject.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_JWT_SECRET: super-secret-test-jwt-secret-at-least-32-chars!
      GMAIL_CLIENT_ID: test-gmail-client-id.apps.googleusercontent.com
      GMAIL_CLIENT_SECRET: test-gmail-client-secret
      GMAIL_REDIRECT_URI: http://localhost:8000/auth/gmail/callback
      OAUTH_STATE_SECRET: test-oauth-state-secret-at-least-32-chars!
      OPENROUTER_API_KEY: test-openrouter-key
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: mypy app
      - run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Supabase is intentionally unset: the middleware then lets requests
      # through and every API call is mocked by the specs.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
