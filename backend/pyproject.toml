[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]
ignore = [
  "E501",  # the formatter owns line length; long prompt/fixture strings are intentional
  "B008",  # FastAPI's Depends()/Query() defaults are idiomatic
  "RUF001",  # en/em dashes in prompt and fixture copy are intentional typography
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ", "RUF012"]
"scripts/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
